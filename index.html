<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Care Home Demo</title>
<meta name="description" content="Demo care home operations app with made-up data: owner dashboard, carer, nurse, cook and manager screens, with voice notes.">
<meta name="theme-color" content="#1f6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Care Demo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-l">
      <div class="eyebrow" id="roleLabel">Demo</div>
      <label class="home-pick">
        <span class="sr">Choose a home</span>
        <select id="homeSelect" aria-label="Choose a home"></select>
      </label>
    </div>
    <button type="button" class="ghost-btn" data-act="about" aria-label="About this demo">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<button type="button" id="micBtn" class="mic" data-act="mic" aria-label="Speak">
  <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <span>Speak</span>
</button>

<nav class="tabs" aria-label="Who is using this">
  <div class="tabs-in" id="tabs"></div>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js?v=1"></script>
</body>
</html>
